<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved theme before first paint to avoid a flash of the wrong theme.
			try {
				document.documentElement.dataset.theme =
					JSON.parse(localStorage.getItem('lituk:theme')) || 'auto';
			} catch {
				document.documentElement.dataset.theme = 'auto';
			}
		</script>
		<meta name="theme-color" content="#1d4ed8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// Count the path only, so query strings (?saved=, ?starred=) don't split a page's views.
			window.goatcounter = { path: () => location.pathname };
		</script>
		<script
			data-goatcounter="https://lifeinuktest.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
